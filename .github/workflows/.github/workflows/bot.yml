name: Run Bybit Bot

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час автоматически
  workflow_dispatch: # Позволяет запустить бота вручную в любой момент

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pybit requests

      - name: Run bot script
        run: |
          python bot.py
